robot_id: SIM-A
cluster_id: swarm-local
data_root: ~/.ros/swarm
transport:
  mqtt_host: 127.0.0.1
  mqtt_port: 1883
  platform_prefix: fh/swarm/dev/dispatch
  mqtt_prefix: fh/swarm/v1
consensus:
  election_timeout: 5.0
  heartbeat_period: 0.4
  quorum_timeout: 3.0
coordinator:
  phase_timeout: 30.0
  planning_timeout: 60.0
  offline_timeout: 10.0
  stale_timeout: 3.0
  footprint_radius: 0.3
  free_thresh: 0.05
  # media_roots: [/home/cat/Workspace/task_ws/src/inspection_task_hub/runtime]
planner:
  planning_timeout: 45.0
  footprint_radius: 0.3
  free_thresh: 0.05
agent:
  allow_motion: false
  task_hub_prefix: /swarm/mock
  capabilities: [device]
  nominal_speed: 1.0
  permit_seconds: 10.0
  task_hub_call_timeout: 15.0
